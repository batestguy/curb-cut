[project]
name = "curb-cut"
version = "0.0.0"
description = "Accessible, zero-cost data platform for Nigerian disability data"
requires-python = ">=3.12,<3.13"
license = "MIT"

[tool.uv]
package = false
default-groups = ["dev", "transform"]

[tool.uv.workspace]
members = ["packages/*"]
# dbt project, not a Python package; its scripts run in the root environment.
exclude = ["packages/transform"]

[tool.uv.sources]
disability-access-charts = { workspace = true }
curbcut-ingest = { workspace = true }

[dependency-groups]
dev = [
    "curbcut-ingest",
    "disability-access-charts",
    "pre-commit>=4",
    "pypdfium2==5.14.0",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
]
transform = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
