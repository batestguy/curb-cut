[project]
name = "curbcut-ingest"
version = "0.0.0"
description = "Curb Cut ingest: extract public source tables into tidy, provenance-tracked CSV"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "doubleml==0.11.4",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "pdfplumber==0.11.10",
    "pyarrow==26.0.0",
    "pyfixest==0.60.0",
    "pypdfium2==5.14.0",
    "pyreadstat==1.3.6",
    "rasterio==1.5.2",
    "scikit-learn==1.9.1",
    "svy==0.35.0",
]

[project.scripts]
curbcut-ingest-jonapwd = "curbcut_ingest.jonapwd:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curbcut_ingest"]
