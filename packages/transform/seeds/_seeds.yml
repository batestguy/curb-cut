version: 2

seeds:
  - name: dim_states
    description: The 36 states and the Federal Capital Territory, with ISO 3166-2 codes and geopolitical zones.
    columns:
      - name: state
        data_tests: [unique, not_null]
      - name: state_code
        data_tests: [unique, not_null]
      - name: zone
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [North Central, North East, North West, South East, South South, South West]

  - name: state_name_aliases
    description: Non-canonical state spellings seen in sources, mapped to dim_states. Matched after normalise_state_key().
    columns:
      - name: alias
        data_tests: [unique, not_null]
      - name: state
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_states')
                field: state

  - name: disability_types
    description: The ten JONAPWD categories, with display labels and order.
    columns:
      - name: disability_type
        data_tests: [unique, not_null]
      - name: sort_order
        data_tests: [unique, not_null]

  - name: state_facts
    description: >
      Facts shown on the state card. Capitals from Wikipedia ("States of Nigeria"). Slogans
      from Zikoko (2025), kept only where Wikipedia's "List of nicknames of Nigerian states"
      agrees; Ekiti and Osun differ between the two and are left blank. population_2023 is
      the NBS Demographic Bulletin 2023, Annex 3 projection (source: National Population
      Commission), cited; the datasheet itself is not redistributed. See docs/verification.md.
    config:
      column_types:
        population_2023: bigint
      meta:
        population_source_url: https://microdata.nigerianstat.gov.ng/index.php/catalog/182
    columns:
      - name: state
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_states')
                field: state
      - name: capital
        data_tests: [not_null]
      - name: capital_source_url
        data_tests: [not_null]
      - name: population_2023
        data_tests: [not_null, non_negative]

  - name: state_population_by_sex_2023
    description: >
      NBS Demographic Bulletin 2023, Annex 3: 2023 projections by state and sex (source:
      National Population Commission), 74 cited figures copied by
      packages/ingest/src/curbcut_ingest/nbs_annex3.py from the git-ignored datasheet.
      Males + females equal state_facts.population_2023 (tested). See docs/verification.md D8.
    config:
      meta:
        population_source_url: https://microdata.nigerianstat.gov.ng/index.php/catalog/182
    data_tests:
      - unique_combination:
          arguments:
            columns: [state, sex]
    columns:
      - name: state
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_states')
                field: state
      - name: sex
        data_tests:
          - accepted_values:
              arguments:
                values: [male, female]
      - name: population_2023
        data_tests: [not_null, non_negative]
