version: 2

sources:
  - name: jonapwd
    description: >
      Figures extracted from JONAPWD, "2025 Assumptive Disability Disaggregated Data"
      (c) JONAPWD, all rights reserved; cited, not redistributed. Assumption-based: the
      global 15% benchmark applied to population projections. Provenance and hand
      validation are in data/public/jonapwd/README.md and manifest.json.
    meta:
      source_url: https://jonapwdng.org/wp-content/uploads/2026/03/2025-Assumptive-Disability-Disaggregated-Data-2.pdf
      publisher_page: https://jonapwdng.org/10865-2/
      pdf_sha256: c861f33cdfd8ed79e83598acb853dc2295667b9d169cd511e4beb1a54d638732
      licence: (c) JONAPWD. All rights reserved.
    tables:
      - name: state_disability_type
        description: One row per state and disability type, as printed (PDF pages 14-50).
        meta:
          # Read the committed CSV in place (dbt-duckdb external source). The path is
          # relative to packages/transform, where dbt is run. Types are cast in staging
          # (dbt-duckdb formats this string with str.format, so no braces here).
          external_location: "read_csv('../../data/public/jonapwd/state_disability_type.csv', header = true, all_varchar = true)"
        columns:
          - name: state
            data_tests: [not_null]
          - name: persons
            data_tests: [not_null]

  - name: survey_aggregates
    description: >
      Survey aggregates written by the disclosure gate (packages/ingest/src/curbcut_ingest/
      disclosure.py), one CSV per source and level. Every cell with fewer than 30
      unweighted respondents is suppressed, and every row carries an NCHS precision flag.
      Provenance (dataset version, terms, SHA-256, script commit) is in
      data/public/aggregates/manifest.json. The folder is a var, so the fixture build reads
      synthetic files with the same schema from fixtures/aggregates.
    tables:
      - name: dhs2024_state
        description: DHS 2024, WG-SS DISABILITY3 and each domain at level 3+, by state, ages 18+ and 5-17.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/dhs2024_state.csv', header = true, all_varchar = true)"
      - name: dhs2024_national
        description: DHS 2024 national, including the 4-level distribution per domain and breakdowns by sex.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/dhs2024_national.csv', header = true, all_varchar = true)"
      - name: ghs_w4_national_zone
        description: GHS-Panel W4, adults 18+, national (DISABILITY3 and domains) and zone (DISABILITY3). Never by state.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/ghs_w4_national_zone.csv', header = true, all_varchar = true)"
      - name: ghs_w5_national_zone
        description: GHS-Panel W5, as W4.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/ghs_w5_national_zone.csv', header = true, all_varchar = true)"
      - name: mpi2021_state_national
        description: >
          MPI 2021 measures under MPI's own (non-WG) definitions, never DISABILITY3. Read when
          include_mpi is true (the default).
        meta:
          external_location: "read_csv('{{ var('mpi_aggregates_path') }}', header = true, all_varchar = true)"

  - name: worldpop
    description: >
      WorldPop (2025). Bottom-up gridded population estimates for Nigeria, version 3.0.
      Nnanatu et al., University of Southampton, doi:10.5258/SOTON/WP00782. CC BY 4.0.
      Used only to cross-check the NBS 2023 state denominators (docs/verification.md D44).
    tables:
      - name: states_pop_total_scaled
        description: State totals scaled to the UN WPP July 2025 median (file as published, LF line endings).
        meta:
          external_location: "read_csv('../../data/public/worldpop/states_pop_total_scaled.csv', header = true, all_varchar = true)"
