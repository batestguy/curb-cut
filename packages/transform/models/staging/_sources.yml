version: 2

sources:
  - name: jonapwd
    description: >
      Figures extracted from JONAPWD, "2025 Assumptive Disability Disaggregated Data"
      (c) JONAPWD, all rights reserved; cited, not redistributed. Assumption-based: the
      global 15% benchmark applied to population projections. Provenance and hand
      validation are in data/public/jonapwd/README.md and manifest.json.
    meta:
      source_url: https://jonapwdng.org/wp-content/uploads/2026/03/2025-Assumptive-Disability-Disaggregated-Data-2.pdf
      publisher_page: https://jonapwdng.org/10865-2/
      pdf_sha256: c861f33cdfd8ed79e83598acb853dc2295667b9d169cd511e4beb1a54d638732
      licence: (c) JONAPWD. All rights reserved.
    tables:
      - name: state_disability_type
        description: One row per state and disability type, as printed (PDF pages 14-50).
        meta:
          # Read the committed CSV in place (dbt-duckdb external source). The path is
          # relative to packages/transform, where dbt is run. Types are cast in staging
          # (dbt-duckdb formats this string with str.format, so no braces here).
          external_location: "read_csv('../../data/public/jonapwd/state_disability_type.csv', header = true, all_varchar = true)"
        columns:
          - name: state
            data_tests: [not_null]
          - name: persons
            data_tests: [not_null]

  - name: survey_aggregates
    description: >
      Survey aggregates written by the disclosure gate (packages/ingest/src/curbcut_ingest/
      disclosure.py), one CSV per source and level. Every cell with fewer than 30
      unweighted respondents is suppressed, and every row carries an NCHS precision flag.
      Provenance (dataset version, terms, SHA-256, script commit) is in
      data/public/aggregates/manifest.json. The folder is a var, so the fixture build reads
      synthetic files with the same schema from fixtures/aggregates. Every file has
      breakdown and breakdown_level ("all" on rows without an extra breakdown); one cell is
      source, measure, geography_level, geography, age_group, sex, breakdown,
      breakdown_level.
    tables:
      - name: dhs2024_state
        description: >
          DHS 2024, WG-SS DISABILITY3 and each domain at level 3+, by state, ages 18+ and
          5-17: overall, by sex, and by urban/rural and wealth quintile (breakdown column).
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/dhs2024_state.csv', header = true, all_varchar = true)"
      - name: dhs2024_national
        description: >
          DHS 2024 national, including the 4-level distribution per domain, breakdowns by
          sex, and by urban/rural, wealth quintile and age band (breakdown column).
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/dhs2024_national.csv', header = true, all_varchar = true)"
      - name: dhs2024_zone
        description: >
          DHS 2024 by geopolitical zone: overall and by sex, urban/rural, wealth quintile
          and age band (DISABILITY3 only), ages 18+ and 5-17.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/dhs2024_zone.csv', header = true, all_varchar = true)"
      - name: ghs_w4_national_zone
        description: GHS-Panel W4, adults 18+, national (DISABILITY3 and domains) and zone (DISABILITY3). Never by state.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/ghs_w4_national_zone.csv', header = true, all_varchar = true)"
      - name: ghs_w5_national_zone
        description: GHS-Panel W5, as W4.
        meta:
          external_location: "read_csv('{{ var('aggregates_dir') }}/ghs_w5_national_zone.csv', header = true, all_varchar = true)"
      - name: mpi2021_state_national
        description: >
          MPI 2021 measures under MPI's own (non-WG) definitions, never DISABILITY3. Read when
          include_mpi is true (the default).
        meta:
          external_location: "read_csv('{{ var('mpi_aggregates_path') }}', header = true, all_varchar = true)"

  - name: worldpop
    description: >
      WorldPop (2025). Bottom-up gridded population estimates for Nigeria, version 3.0.
      Nnanatu et al., University of Southampton, doi:10.5258/SOTON/WP00782. CC BY 4.0.
      Used only to cross-check the NBS 2023 state denominators (docs/verification.md D44).
    tables:
      - name: states_pop_total_scaled
        description: State totals scaled to the UN WPP July 2025 median (file as published, LF line endings).
        meta:
          external_location: "read_csv('../../data/public/worldpop/states_pop_total_scaled.csv', header = true, all_varchar = true)"

  - name: covariates
    description: >
      Fay-Herriot state covariates frozen in docs/fay-herriot-covariates.md (P4a step 2),
      built by packages/ingest/src/curbcut_ingest/covariates.py from public sources: C1
      WorldPop 2020 age structures (CC BY 4.0), C2 JRC GHSL R2023A (CC BY 4.0), C3 NBS
      Nigeria MPI 2022 Table D6 (figures cited), C5 NBS 2023 population over geoBoundaries
      area, C4 MICS6 2021 Table SR.6.1W literacy of women 15-49 (figures cited). Provenance and hashes are in
      data/public/covariates/README.md and manifest.json.
    tables:
      - name: state_covariates
        description: One row per state; raw (unstandardised) covariates plus two WorldPop benchmark-weight columns that are not covariates.
        meta:
          external_location: "read_csv('../../data/public/covariates/state_covariates.csv', header = true, all_varchar = true)"

  - name: ndhs_report
    description: >
      Figures cited from the Nigeria DHS 2023-24 final report (NPC and ICF, FR395), chapter
      14, transcribed by hand (data/public/ndhs_report/README.md). The report is not
      redistributed. Used for the main page's comparison; checked against our pipeline by
      curbcut_ingest.validate_ndhs (docs/verification.md D46, D48).
    tables:
      - name: fr395_table14_1
        description: Table 14.1 (p. 443), household population 5+ (de facto), by domain and age. Percentages.
        meta:
          external_location: "read_csv('../../data/public/ndhs_report/fr395_table14_1.csv', header = true, all_varchar = true)"
        columns:
          - name: row
            data_tests: [unique, not_null]

  - name: spatial
    description: >
      Spatial analysis of the DHS 2024 direct state estimates (P4a step 3,
      docs/verification.md D57, D58), committed by curbcut_ingest.spatial and
      curbcut_ingest.grid3 from public inputs only. Never run on JONAPWD (D17). The fixture
      build reads the same committed files: they hold no microdata.
    tables:
      - name: moran_global
        description: Global Moran's I per measure (one-sided permutation p, Benjamini-Hochberg across the 8).
        meta:
          external_location: "read_csv('../../data/public/spatial/moran_global.csv', header = true, all_varchar = true)"
      - name: lisa_disability3_18plus
        description: Exploratory local Moran's I for DISABILITY3 18+, with BH q across the 37 states.
        meta:
          external_location: "read_csv('../../data/public/spatial/lisa_disability3_18plus.csv', header = true, all_varchar = true)"
      - name: profile_clusters
        description: Descriptive Ward clusters of the six 18+ domain prevalences.
        meta:
          external_location: "read_csv('../../data/public/spatial/profile_clusters.csv', header = true, all_varchar = true)"
      - name: facilities_state
        description: GRID3 NGA Health Facilities v2.0 (CC BY 4.0) counted by state, per 100,000 people (NBS 2023).
        meta:
          external_location: "read_csv('../../data/public/spatial/facilities_state.csv', header = true, all_varchar = true)"
