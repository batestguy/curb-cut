name: curbcut
version: "0.1.0"
config-version: 2
profile: curbcut

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  curbcut:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  curbcut:
    disability_types:
      +column_types:
        sort_order: integer
