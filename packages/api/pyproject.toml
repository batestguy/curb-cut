[project]
name = "curbcut-api"
version = "0.1.0"
description = "Curb Cut API: optional, read-only JSON over the public aggregates the site serves"
requires-python = ">=3.12,<3.13"
license = "MIT"
# fastapi 0.156.4 is the newest release at least two weeks old on 2026-11-04 (see
# docs/api.md, "Packages"). duckdb matches the root environment's pin.
dependencies = [
    "duckdb==1.5.6",
    "fastapi==0.156.4",
    "slowapi==0.1.10",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curbcut_api"]
