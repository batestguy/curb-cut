name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI never sees licensed data: data/restricted/ and data/sources/ (the JONAPWD PDF) are
# git-ignored, so they are not in the checkout. The data job builds only from the committed
# public CSV in data/public/.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Guard restricted zone
        run: |
          if git ls-files | grep -E '^data/(restricted|sources)/|\.duckdb(\.wal)?$|\.pdf$'; then
            echo "Restricted data, source PDFs or DuckDB files are tracked" && exit 1
          fi
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest --cov=packages --cov-report=xml --cov-report=term --cov-fail-under=85

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: dbt deps (metaplane dbt_expectations)
        working-directory: packages/transform
        run: uv run dbt deps --profiles-dir .
      - name: dbt build (seeds, models, tests)
        working-directory: packages/transform
        run: uv run dbt build --profiles-dir .
      # Synthetic fixture aggregates (same schema; edge cases: a suppressed cell, a state
      # with no rows, the held MPI source) in a separate warehouse file.
      - name: dbt build on fixtures
        working-directory: packages/transform
        run: >-
          uv run dbt build --profiles-dir . --target fixtures
          --vars '{aggregates_dir: fixtures/aggregates, include_mpi: true,
          mpi_aggregates_path: fixtures/aggregates/mpi2021_state_national.csv, fixtures: true}'
      - name: dbt docs generate (artifact only, not published)
        working-directory: packages/transform
        run: uv run dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            packages/transform/target/index.html
            packages/transform/target/manifest.json
            packages/transform/target/catalog.json
          if-no-files-found: error
      - name: Export marts to Parquet
        run: uv run python packages/transform/scripts/export_marts.py
      - name: Build chart JSON (fails on a failed accessibility audit)
        run: uv run python packages/transform/scripts/build_charts.py
      - name: Build locator map (from the committed geoBoundaries file; fails if a state is missing)
        run: uv run python packages/transform/scripts/build_map.py
      - uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: site/public/data/
          if-no-files-found: error

  site:
    needs: data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: site-data
          path: site/public/data/
      - name: Install
        run: npm ci
      - name: Build (fetches the pinned DuckDB Parquet extension, then vite build)
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe
        run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
